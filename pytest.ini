[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    real: utilise des états financiers réels téléchargés (lents, nécessitent du réseau au premier passage)
    network: appelle une API externe (SEC EDGAR, FMP…) ; sautés en CI hors ligne
    slow: tests lents (benchmark complet, OCR)
    ocr: nécessite Tesseract installé (adaptateur PDF repris de _base_v1)
